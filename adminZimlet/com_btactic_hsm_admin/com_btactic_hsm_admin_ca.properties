label = Admnistraci\u00f3 Jer\u00e0rquica d\u2019Emmagatzematge (FOSS)
description = Extensi\u00f3 d\u2019administrador d\u2019Admnistraci\u00f3 Jer\u00e0rquica d\u2019Emmagatzematge (FOSS)
zetaHSMTab = HSM (Maldua)
zetaPromo =  Integraci\u00f3 d\u2019HSM Maldua realitzada per <a href="https://www.btactic.com/zimbra-and-beyond-2/" target="_blank">bTactic</a>.
HSMPolicy = Pol\u00edtica d\u2019HSM
HSMExplanationSyntax = Explicaci\u00f3 de la sintaxis de la pol\u00edtica d\u2019HSM: Cada valor especifica un llistat separat-per-comes de <i>tipus</i> i la <i>petici\u00f3 de cerca</i> emprat per seleccionar quins elements moure.

HSMExplanationTypes =\
Tipus d\u2019elements:<br>\
<br>\
  - Missatges: <b>message</b><br>\
  - Documents: <b>document</b><br>\
  - Tasques: <b>task</b><br>\
  - Cites: <b>appointment</b><br>\
  - Contactes: <b>contact</b>

HSMExplanationQueries =\
Exemples de peticions de cerca:<br>\
<br>\
  - M\u00e9s antic que 10080 minuts: <b>before:-10080minutes</b><br>\
  - M\u00e9s antic que 30 dies: <b>before:-30days</b><br>\
  - M\u00e9s antic que 1 dia i que est\u00e0 a la carpeta de la Paperera: <b>before:-1day in:Trash</b>

HSMExplanationExamples =\
<b>Exemples de pol\u00edtiques d\u2019HSM:</b><br>\
<br>\
  - Pol\u00edtica per defecte: <b>message,document:before:-30days</b><br>\
  - Missatges m\u00e9s antics que 129600 minuts: <b>message:before:-129600minutes</b><br>\
  - Documents i p\u00e0gines wiki m\u00e9s antigues que 10080 minuts: <b>document,wiki:before:-10080minutes</b><br>\
  - Missatges m\u00e9s antics que un dia que estan dintre de la carpeta de la Paperera: <b>message:before:-1day in:Trash</b><br>\
  - Missatges i documents m\u00e9s antics que 5 dies que estan en qualsevol carpeta i tamb\u00e9 tenen un adjunt amb tamany m\u00e9s gran que 5 MegaBytes. Tamb\u00e9 assegurat que els missatges s\u2019han llegit.: <b>message,document:before:-5day is:anywhere has:attachment larger:5m is:read</b>

Add_zimbraHsmPolicy = Afegir
Remove_zimbraHsmPolicy = Treure
tt_zimbraHsmPolicy = Pol\u00edtica d\u2019HSM a afegir

EmailsType = Missatges
