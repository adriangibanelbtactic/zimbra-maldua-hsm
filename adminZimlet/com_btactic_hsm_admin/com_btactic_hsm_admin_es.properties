HSMPolicy = Pol\u00edtica de HSM
HSMExplanationSyntax = Explicaci\u00f3n de la sintaxis de la pol\u00edtica de HSM: Cada valor espec\u00edfica un listado separado-por-comas de <i>tipos</i> y la <i>query de b\u00fasqueda</i> usado para seleccionar qu\u00e9 \u00edtems mover.

HSMExplanationTypes =\
Tipos de los \u00edtems:<br>\
<br>\
  - Correos: <b>message</b><br>\
  - Documentos: <b>document</b><br>\
  - Tareas: <b>task</b><br>\
  - Citas: <b>appointment</b><br>\
  - Contactos: <b>contact</b>

HSMExplanationQueries =\
Ejemplos de queries de b\u00fasqueda:<br>\
<br>\
  - M\u00e1s antiguo que 10080 minutos: <b>before:-10080minutes</b><br>\
  - M\u00e1s antiguo que 30 d\u00edas: <b>before:-30days</b><br>\
  - M\u00e1s antiguo que 1 d\u00eda y que est\u00e9 en la carpeta de la papelera: <b>before:-1day in:Trash</b>

HSMExplanationExamples =\
<b>Ejemplos de pol\u00edticas de HSM:</b><br>\
<br>\
  - Pol\u00edtica por defecto: <b>message,document:before:-30days</b><br>\
  - Correos m\u00e1s antiguos que 129600 minutos: <b>message:before:-129600minutes</b><br>\
  - Documentos y p\u00e1ginas wiki m\u00e1s antiguos que 10080 minutos: <b>document,wiki:before:-10080minutes</b><br>\
  - Correos m\u00e1s antiguos que un d\u00eda que est\u00e1n dentro de la carpeta de la papelera: <b>message:before:-1day in:Trash</b><br>\
  - Correos y documentos m\u00e1s antiguos que 5 d\u00edas que est\u00e1n en cualquier carpeta y tambi\u00e9n tienen un adjunto cuyo tama\u00f1o es mayor que 5 MegaBytes. Tambi\u00e9n asegurate que los mensajes se han le\u00eddo.: <b>message,document:before:-5day is:anywhere has:attachment larger:5m is:read</b>

